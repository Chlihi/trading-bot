name: Trading Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run = Bot starten, sell_all = sofort alles verkaufen"
        type: choice
        default: run
        options:
          - run
          - sell_all
  schedule:
    # Zeiten in UTC, Mo-Fr. Deckt Sommer- und Winterzeit der US-Börse ab.
    # Der Bot beendet sich selbst, wenn die Börse nicht bald öffnet.
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "10 19 * * 1-5"
    - cron: "10 20 * * 1-5"

# Es läuft immer nur EIN Bot gleichzeitig ("sell_all" hat eine eigene Gruppe,
# damit es sofort startet und nicht hinter dem Bot wartet).
concurrency:
  group: trading-${{ github.event.inputs.mode || 'run' }}
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          PYTHONUNBUFFERED: "1"
